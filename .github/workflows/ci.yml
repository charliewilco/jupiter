name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  test:
    name: Build and validate themes
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate artifacts
        run: npm run build

      - name: Check generated artifacts are committed
        run: git diff --exit-code

      - name: Build demo
        run: |
          npx parcel build docs/index.html --dist-dir docs-dist --public-url ./
          cp docs/robots.txt docs/sitemap.xml docs-dist/

      - name: Validate themes
        run: npm test
